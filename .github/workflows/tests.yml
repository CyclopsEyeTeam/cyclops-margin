name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tmux and shellcheck
        run: sudo apt-get update && sudo apt-get install -y tmux shellcheck
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Shellcheck
        run: shellcheck -S warning muse-margin margin-pane margin-keep install.sh uninstall.sh shim/muse
